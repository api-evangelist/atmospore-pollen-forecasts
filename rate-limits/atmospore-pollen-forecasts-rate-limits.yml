gaps:
  - No rate-limit response headers; a client cannot pace itself before the 429.
  - No documented burst/per-second limit, only the aggregate allowance.
  - The first-party Python client exposes .limit/.used/.resets_at on RateLimitError, implying the 429 body carries them, but that body is undocumented and undeclared in the spec.
