name: Atmospore Pollen Forecasts
description: >-
  Atmospore is an Oslo-based provider of AI-driven global pollen and allergy forecasting. Its model
  combines GFS weather data with ground-truth observations from professional aerobiology networks
  to produce species-level forecasts on a ~28 km global grid, covering 25 individual tree, grass
  and weed species with multilingual metadata (English, Norwegian, Swedish) and published
  concentration thresholds for low/moderate/high/very-high risk. The surface is delivered three
  ways: a four-operation REST API at pollenapi.com with a live OpenAPI 3.0.3 contract, a hosted
  Model Context Protocol server at mcp.atmospore.com exposing the same capability as four agent
  tools, and a keyless embeddable iframe widget that consumes no API quota. Point forecasts, area
  averages with min/max across a radius, and severity-ranked top species are all available up to
  14 days ahead; species metadata is served unauthenticated.
