gaps:
  - >-
    No status page and no changelog. A consumer has no way to learn that a forecast model
    changed, a species was added, or the service degraded.
  - >-
    No deprecation policy and no Sunset/Deprecation header support, so v1 could move without
    a documented notice period.
  - >-
    The soft-404 catch-all means every probe for /status, /changelog and /roadmap returns
    HTTP 200. Presence cannot be inferred from a status code on this host.
