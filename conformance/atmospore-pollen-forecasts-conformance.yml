generated: '2026-08-09'
method: derived
source: openapi/atmospore-pollen-forecasts-openapi-original.json + live probes of atmospore.com and pollenapi.com
description: >-
  Which cross-cutting standards the Atmospore surface actually conforms to. Derived from the
  published contract and live probes; no compliance claim is made on the provider's behalf.
standards:
  - id: openapi-3.0
    conforms: true
    evidence: 'openapi: 3.0.3 served live at https://pollenapi.com/openapi.json (HTTP 200, application/json)'
  - id: openapi-3.1
    conforms: false
    evidence: Document declares 3.0.3.
  - id: oauth2
    conforms: false
    evidence: Only securityScheme is apiKey in header (x-api-key). No OAuth anywhere, including the MCP server.
  - id: oidc
    conforms: false
  - id: rfc9457-problem-details
    conforms: false
    evidence: 'Errors are application/json with a flat {"error": "<string>"} body; no type/title/status/detail members.'
  - id: rfc9116-security-txt
    conforms: false
    evidence: '/.well-known/security.txt returns 403 on atmospore.com and 404 on pollenapi.com.'
  - id: rfc9727-api-catalog
    conforms: false
    evidence: '/.well-known/api-catalog returns 404 on both hosts.'
  - id: rfc8594-sunset-header
    conforms: false
    evidence: No deprecation policy or Sunset header support published.
  - id: rfc9728-oauth-protected-resource
    conforms: false
    evidence: MCP server is API-key gated; /.well-known/oauth-protected-resource returns 500.
  - id: mcp
    conforms: true
    version_observed: JSON-RPC 2.0 over HTTP
    evidence: >-
      https://mcp.atmospore.com/mcp answers a tools/list POST with a well-formed JSON-RPC error
      object (code -32001). First-party open-source server at github.com/atmospore/atmospore-mcp
      built on mcp>=1.2 / FastMCP.
    caveat: >-
      Live capability negotiation is auth-gated, so protocol version and server capabilities
      were not observed anonymously.
  - id: a2a
    conforms: false
    evidence: '/.well-known/agent-card.json and /.well-known/agent.json miss on all three hosts.'
  - id: asyncapi
    conforms: false
    evidence: No event, streaming or webhook surface exists. Not applicable rather than missing.
  - id: json-schema
    conforms: partial
    evidence: 'components.schemas defines Error, SpeciesData, AreaSpeciesData and TopSpeciesData (OpenAPI 3.0 schema dialect).'
  - id: iso-8601
    conforms: true
    evidence: 'dt uses format: date (YYYY-MM-DD); meta.generated_at is RFC 3339.'
  - id: tls-1.3
    conforms: true
    evidence: security/atmospore-pollen-forecasts-domain-security.yml — TLSv1.3 on atmospore.com and pollenapi.com.
  - id: hsts
    conforms: false
    evidence: No Strict-Transport-Security header on either host.
  - id: dnssec
    conforms: false
    evidence: Neither atmospore.com nor pollenapi.com is signed.
  - id: caa
    conforms: false
    evidence: No CAA records on either registrable domain.
  - id: dmarc
    conforms: partial
    evidence: 'atmospore.com publishes SPF and DMARC with p=none (monitor only); pollenapi.com publishes neither.'
  - id: gdpr
    conforms: unknown
    evidence: >-
      A privacy policy and a cookie-consent surface are published (Oslo, Norway establishment),
      but no GDPR statement, DPA or sub-processor list was found.
certifications:
  published: []
  note: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP claim appears anywhere on the site. No trust
    center exists (trust.atmospore.com is NXDOMAIN; /trust, /security and /compliance all resolve
    to the single-page-app catch-all). NO `Compliance` pointer is wired in apis.yml — there is no
    published compliance program to point at.
agent_access_policy:
  robots_txt: https://atmospore.com/robots.txt
  x-evidence: {fetched: '2026-08-09', http_status: 200}
  general: 'User-agent: * Allow: / ; Disallow: /api/'
  ai_crawlers_disallowed:
    - GPTBot
    - ChatGPT-User
    - Google-Extended
    - CCBot
    - anthropic-ai
    - Claude-Web
    - cohere-ai
    - PerplexityBot
    - Bytespider
  reading: >-
    Atmospore blocks every named AI crawler from its marketing and documentation site while
    simultaneously shipping a hosted MCP server and marketing "Ask Claude about pollen". The
    posture is deliberate and coherent — agents are meant to arrive through the metered MCP/REST
    contract, not by scraping the docs — but it means an agent cannot read the documentation to
    learn how to call the API. pollenapi.com serves no robots.txt at all (404).
  no_ai_preference_signals: [ai.txt, llms.txt, AIPREF, Content-Signal]
